<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super-Heróis Digitais</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- INÍCIO -->
<section id="home" class="screen on">
  <div class="home-card">
    <div class="pixel" id="homePixel"></div>
    <div>
      <h1>Super-Heróis <b>Digitais</b></h1>
      <p>Cuida do teu corpo e porta-te bem na internet.</p>
      <div class="field">
        <label for="nameIn">Como te chamas?</label>
        <input id="nameIn" autocomplete="off" maxlength="30" placeholder="Escreve o teu nome">
      </div>
      <div class="field" style="margin-top:12px">
        <label for="turmaIn">A tua turma</label>
        <select id="turmaIn" class="inp" style="font-size:20px"></select>
      </div>
      <div class="home-msg" id="homeMsg"></div>
      <button class="btn big" id="goBtn">Começar a missão</button>
    </div>
  </div>
</section>

<!-- MAPA -->
<section id="map" class="screen">
  <div class="wrap">
    <div class="map-top">
      <h2>Mapa das missões</h2>
      <div class="total" id="totalStars">⭐ 0</div>
    </div>
    <div class="say"><div class="pixel" id="mapPixel"></div><div class="bubble" id="mapSay"></div></div>
    <ol class="path" id="path"></ol>
    <div style="margin-top:18px;text-align:center"><button class="btn ghost" id="exitBtn">Sair (outro aluno)</button></div>
  </div>
</section>

<!-- MISSÃO -->
<section id="mission" class="screen">
  <div class="topbar">
    <button class="btn ghost" id="toMap" style="padding:8px 14px">🗺️ Mapa</button>
    <div class="title" id="mTitle"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div id="stage"></div>
  <div class="navbar">
    <button class="btn ghost" id="prevBtn">◀ Anterior</button>
    <button class="btn" id="nextBtn">Próximo ▶</button>
  </div>
</section>

<div id="confetti"></div>
<div id="modalRoot"></div>

<script src="js/firebase-config.js"></script>
<script src="js/comum.js"></script>
<script src="js/app.js"></script>
</body>
</html>
